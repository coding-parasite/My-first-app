  options:["A producer secretly returning part of their commission to a client to close a sale","A carrier offering a multi-policy discount that is filed and disclosed in its rate structure","A producer giving a client cash to switch carriers","A producer waiving a fee that isn't part of the filed rate, as a personal favor"],
  correctIndex:1,
  statuteCitation:"Unfair Insurance Practices Act, 40 P.S. § 1171.1 et seq.",
  explanation:"A filed, disclosed discount available to all qualifying policyholders is a legitimate rating factor, not rebating — the prohibition targets undisclosed, selectively-given inducements outside the filed rate structure." },

{ id:86, category:"PA Regulations", difficulty:"hard", tags:["cancellation","notice-periods"], verifyCurrent:true,
  question:"A Pennsylvania insurer cancels a commercial auto policy 20 days after inception for underwriting reasons unrelated to nonpayment. What notice period applies?",
  options:["15 days","30 days","45 days","60 days"],
  correctIndex:1,
  statuteCitation:"Act 205 of 1982, 40 P.S. § 3401 et seq.",
  explanation:"Since the policy has been in force less than 60 days and the reason isn't nonpayment or misrepresentation, the 30-day midterm rule applies. 15 days would only apply to nonpayment/misrepresentation, and 60 days is the general rule that only fully governs once the policy is past its first 60 days. There is no 45-day tier in Pennsylvania's notice structure." },

{ id:87, category:"PA Regulations", difficulty:"medium", tags:["cancellation","notice-periods"], verifyCurrent:true,
  question:"An insurer wants to cancel a five-year-old personal auto policy solely because the insured filed several claims (not for nonpayment). What is the minimum required notice?",
  options:["15 days","30 days","45 days","60 days"],
  correctIndex:3,
  statuteCitation:"Act 205 of 1982, 40 P.S. § 3401 et seq.",
  explanation:"Because the policy has been in force well beyond 60 days and the reason isn't nonpayment or misrepresentation, the general 60-day rule governs. Selecting 15 or 30 confuses this scenario with the shorter exceptions that only apply to nonpayment/misrepresentation or brand-new policies." },

{ id:88, category:"PA Regulations", difficulty:"easy", tags:["cancellation","notice-periods"],
  question:"Which of these circumstances justifies only a 15-day cancellation notice in Pennsylvania?",
  options:["Ordinary underwriting reasons on a policy older than 60 days","Nonpayment of premium","The insured moved out of state","The policy is more than five years old"],
  correctIndex:1,
  statuteCitation:"Act 205 of 1982, 40 P.S. § 3401 et seq.",
  explanation:"15 days is specifically reserved for nonpayment of premium and material misrepresentation affecting insurability. The other scenarios listed don't trigger the shortened notice period on their own — ordinary underwriting reasons on an established policy require the full 60-day notice instead." },

{ id:89, category:"PA Regulations", difficulty:"medium", tags:["license-renewal"],
  question:"Under general Pennsylvania licensing practice, what happens if a producer's license lapses well beyond the short grace period and stays inactive for an extended time?",
  options:["Nothing; it can be reactivated anytime for free with no conditions","The producer may need to retest and reapply as if a new applicant","The producer automatically becomes a nonresident licensee","The Insurance Department issues a permanent industry-wide ban"],
  correctIndex:1,
  statuteCitation:"PA Insurance Department licensing reinstatement practice",
  explanation:"A brief lapse can typically be cured through the short grace-period reinstatement process, but a long-term lapse generally requires treating the individual as a new applicant, including retesting. Option D wildly overstates the consequence, and option C confuses residency status with license status." },

{ id:90, category:"PA Regulations", difficulty:"medium", tags:[],
  question:"A producer licensed only in the 'Property' line of authority in Pennsylvania wants to sell auto liability insurance, which falls under 'Casualty.' What must they do first?",
  options:["Nothing, property automatically includes casualty coverage","Add the Casualty line of authority to their license","Wait one year before adding any new line","Complete only continuing education, with no application needed"],
  correctIndex:1,
  statuteCitation:"Insurance Department Act of 1921 (lines of authority structure)",
  explanation:"Lines of authority are separate; a Property-only license doesn't authorize selling Casualty products like auto liability. The producer must formally add the Casualty line before soliciting that business — CE alone doesn't grant a new line of authority." },

{ id:91, category:"PA Regulations", difficulty:"medium", tags:[],
  question:"Does Pennsylvania require producers to carry errors & omissions (E&O) insurance as a condition of licensure?",
  options:["Yes, mandatory for all producers","No, Pennsylvania does not mandate E&O insurance for licensure, though it's strongly recommended","Only required for producers licensed more than 10 years","Only required for surplus lines producers"],
  correctIndex:1,
  statuteCitation:"PA Insurance Department licensing requirements (no statutory E&O mandate)",
  explanation:"E&O coverage is a prudent business practice and often required by agency contracts or errors-and-omissions best practices, but Pennsylvania doesn't statutorily require it to hold a producer license. Assuming it's mandatory (option A) is a common misconception carried over from other professional licensing contexts." },

{ id:92, category:"PA Regulations", difficulty:"medium", tags:[],
  question:"An insurer reasonably believes a claim involves fraud. What does Pennsylvania law generally require?",
  options:["Nothing; reporting suspected fraud is entirely optional","The insurer must report suspected fraud to the appropriate authorities","The insurer must pay the claim regardless of suspected fraud","Only law enforcement can initiate a fraud inquiry, never the insurer"],
  correctIndex:1,
  statuteCitation:"18 Pa.C.S. § 4117 (Insurance fraud) and related mandatory reporting duties",
  explanation:"Pennsylvania law criminalizes insurance fraud and expects insurers to report suspected fraudulent claims activity to appropriate authorities rather than simply absorbing or ignoring it. Option C wrongly suggests suspicion of fraud has no bearing on claims handling at all." },

{ id:93, category:"PA Regulations", difficulty:"medium", tags:["mvfrl"],
  question:"An auto liability policy excludes coverage for certain lawsuits between resident relatives living in the same household as the insured. This concept refers to:",
  options:["The household exclusion, common in liability policies for intra-family suits","A total ban on ever insuring family members under any policy","A federal law that overrides Pennsylvania rules on this topic","A provision unique to workers' compensation only"],
  correctIndex:0,
  statuteCitation:"Standard auto/liability policy household exclusion provisions",
  explanation:"Household exclusions limit certain liability claims between resident family members to reduce collusion risk and duplicate-payout concerns; they don't ban insuring relatives generally, and they aren't a workers'-comp-specific concept, contrary to options B and D." },

{ id:94, category:"PA Regulations", difficulty:"medium", tags:["mvfrl","pip"],
  question:"Under the MVFRL, first-party medical benefits are generally available to which of the following?",
  options:["Only the vehicle's registered owner","The named insured, resident relatives, and other occupants/pedestrians as defined by the statute","Only occupants of the vehicle, never pedestrians","Only Pennsylvania residents, regardless of relationship to the policy"],
  correctIndex:1,
  statuteCitation:"75 Pa.C.S. § 1712 (Availability of benefits)",
  explanation:"Section 1712 extends first-party medical benefit availability beyond just the named insured to resident relatives and certain other occupants or pedestrians as the statute defines. Limiting it to only the registered owner (option A) or only vehicle occupants (option C) understates the statute's actual reach." },

{ id:95, category:"PA Regulations", difficulty:"hard", tags:["mvfrl","tort-options"],
  question:"Under limited tort, which type of injury generally still allows a full lawsuit for pain and suffering despite the limited tort election?",
  options:["Any injury requiring more than one doctor visit","A 'serious injury' as defined by the MVFRL, such as death, serious impairment of a body function, or permanent disfigurement","Any injury resulting in over $500 of medical bills","No exceptions exist once limited tort is elected"],
  correctIndex:1,
  statuteCitation:"75 Pa.C.S. § 1702 (Definitions — serious injury)",
  explanation:"Limited tort restricts non-economic (pain and suffering) recovery unless the injury meets the statutory 'serious injury' threshold. Dollar amounts of medical bills or visit counts (options A and C) are not the legal test — the definition turns on the nature and severity of the injury itself." },

{ id:96, category:"PA Regulations", difficulty:"medium", tags:[],
  question:"Before a Pennsylvania P&C insurer can use a new policy form, what must generally happen?",
  options:["Nothing; policy forms are entirely unregulated","The form is generally subject to filing and review requirements with the Insurance Department","Only federal approval is required, never state approval","Approval from the FAIR Plan is required for every new form"],
  correctIndex:1,
  statuteCitation:"Insurance Company Law of 1921 (policy form filing and review provisions)",
  explanation:"Pennsylvania, like other states, requires insurers to submit policy forms for regulatory filing and review before use, ensuring compliance with state requirements. Option C wrongly imports federal oversight into what is fundamentally state-based insurance regulation." },

{ id:97, category:"PA Regulations", difficulty:"medium", tags:["ce"],
  question:"A nonresident Pennsylvania-licensed producer who is properly licensed and meets their home state's CE requirements generally:",
  options:["Must still complete Pennsylvania's full 24-hour CE requirement separately","Can satisfy Pennsylvania's CE requirement through home-state CE compliance under reciprocity","Is permanently exempt from any CE obligation","Must complete CE only if they sell Pennsylvania auto policies specifically"],
  correctIndex:1,
  statuteCitation:"PA CE reciprocity rules for nonresident producers",
  explanation:"Reciprocity generally lets a nonresident producer satisfy Pennsylvania's CE expectation by meeting their home state's CE requirements, avoiding duplicate coursework. Requiring the full separate 24 hours on top of home-state CE (option A) ignores the entire point of reciprocity arrangements." },

{ id:98, category:"PA Regulations", difficulty:"medium", tags:[],
  question:"If an insurer terminates a producer's appointment 'for cause,' such as suspected fraud, what is generally required?",
  options:["Nothing beyond the insurer's internal HR records","The insurer must report the reason for the for-cause termination to the Insurance Department within a specified timeframe","The producer's license is automatically revoked with no further process","Only verbal notice to the producer is needed, with no regulatory filing"],
  correctIndex:1,
  statuteCitation:"PA producer termination-for-cause reporting rules",
  explanation:"For-cause terminations trigger a regulatory reporting obligation so the Department can track producer conduct issues across appointments — this is distinct from license revocation, which requires its own separate disciplinary process rather than happening automatically." },

{ id:99, category:"PA Regulations", difficulty:"easy", tags:[],
  question:"Which of these is a valid ground for the Pennsylvania Insurance Department to deny, suspend, or revoke a producer's license?",
  options:["Filing too many legitimate personal insurance claims","Providing materially false information on the license application","Working as a producer only part-time","Being younger than 25 years old"],
  correctIndex:1,
  statuteCitation:"Insurance Department Act of 1921 (license denial/discipline grounds)",
  explanation:"Material misrepresentation on a license application is a recognized, serious ground for licensing action. The other options describe ordinary, lawful circumstances (personal claims history, part-time work, age within the legal range) that have no bearing on license eligibility." },

{ id:100, category:"PA Regulations", difficulty:"medium", tags:["carsharing"],
  question:"Under Pennsylvania's carsharing law, during what period must the carsharing program's insurance coverage generally be in effect?",
  options:["Only during the actual rental/trip period", "From the moment the vehicle is listed until it's permanently delisted, regardless of any actual use","Only after a claim has already been filed","Never; the personal policy always applies instead"],
  correctIndex:0,
  statuteCitation:"Pennsylvania peer-to-peer carsharing insurance law (2022 amendment)",
  explanation:"The carsharing program's coverage is generally tied to the actual rental/trip period defined by the carsharing agreement, not an indefinite listing window. Option B would make the coverage far broader (and the cost structure far different) than how these carsharing statutes are actually designed to operate." },

{ id:101, category:"PA Regulations", difficulty:"easy", tags:["fair-plan"],
  question:"The Pennsylvania FAIR Plan primarily provides which type of coverage?",
  options:["Auto liability coverage","Basic property coverage (fire and extended coverage perils) for hard-to-place risks","Workers' compensation coverage","Professional liability coverage"],
  correctIndex:1,
  statuteCitation:"31 Pa. Code Ch. 59 (FAIR Plan regulations)",
  explanation:"FAIR Plans are property-focused, addressing fire and extended coverage perils for owners who can't secure coverage voluntarily. Confusing it with auto (option A) or workers' comp (option C) mixes it up with entirely separate market-of-last-resort mechanisms." },

{ id:102, category:"PA Regulations", difficulty:"medium", tags:["guaranty-association"],
  question:"How is the Pennsylvania Property and Casualty Insurance Guaranty Association generally funded?",
  options:["Federal tax dollars","Assessments on other admitted P&C insurers doing business in Pennsylvania","Policyholder premiums directly earmarked at the point of purchase","State lottery proceeds"],
  correctIndex:1,
  statuteCitation:"PA insurance guaranty association statute",
  explanation:"Guaranty associations are funded through post-insolvency assessments levied on other admitted insurers in the same market, spreading the cost of a failed insurer's obligations across the remaining industry rather than relying on premiums, taxes, or unrelated state revenue sources." },

{ id:103, category:"PA Regulations", difficulty:"easy", tags:["workers-comp"],
  question:"Which of the following is NOT one of the standard ways a Pennsylvania employer can satisfy its workers' compensation coverage obligation?",
  options:["A private insurance carrier","The State Workers' Insurance Fund (SWIF)","Approved self-insurance","Enrolling employees in Medicare"],
  correctIndex:3,
  statuteCitation:"Workers' Compensation Act, 77 P.S. § 1 et seq.",
  explanation:"Pennsylvania employers satisfy their mandatory coverage obligation through a private carrier, SWIF, or approved self-insurance — Medicare is a federal health program for eligible individuals and has no role in satisfying an employer's workers' comp coverage duty." },

{ id:104, category:"PA Regulations", difficulty:"easy", tags:[],
  question:"How does a person become the Pennsylvania Insurance Commissioner?",
  options:["Elected directly by Pennsylvania voters","Appointed by the Governor, subject to Senate confirmation","Elected by a vote of licensed producers","Appointed directly by the NAIC"],
  correctIndex:1,
  statuteCitation:"Commonwealth of Pennsylvania executive appointment structure; Insurance Department Act of 1921",
  explanation:"The Commissioner is a gubernatorial appointee confirmed by the state Senate, not an elected office or an NAIC-appointed position. The NAIC (option D) is a standard-setting association of state regulators, not an appointing authority over any single state's commissioner." },

{ id:105, category:"PA Regulations", difficulty:"medium", tags:["unfair-practices"],
  question:"Under Pennsylvania's unfair practices framework, which underwriting factor would be most likely scrutinized as unfairly discriminatory if used without proper actuarial justification?",
  options:["Driving record","Race","Prior claims history","Vehicle safety rating"],
  correctIndex:1,
  statuteCitation:"Unfair Insurance Practices Act, 40 P.S. § 1171.1 et seq.",
  explanation:"Race is a protected characteristic and using it as an underwriting factor is unfairly discriminatory regardless of any claimed actuarial link. Driving record, claims history, and vehicle safety ratings are legitimate, commonly used rating factors precisely because they have a recognized actuarial connection to risk." },

{ id:106, category:"PA Regulations", difficulty:"medium", tags:[],
  question:"Can an insurer sell a Pennsylvania P&C policy through a producer who is not licensed in Pennsylvania?",
  options:["Yes, always, regardless of licensing status","No — the producer must generally hold a valid Pennsylvania resident or nonresident license to transact business here","Only for policies under $500 in annual premium","Only online sales are exempt from this licensing rule"],
  correctIndex:1,
  statuteCitation:"Insurance Department Act of 1921 (licensing requirement to transact insurance business)",
  explanation:"Transacting insurance business in Pennsylvania — soliciting, negotiating, or selling policies — generally requires a valid producer license, resident or nonresident. There's no premium-size exemption (option C) or online-sales carve-out (option D) that bypasses this licensing requirement." },

{ id:107, category:"PA Regulations", difficulty:"medium", tags:["act142"],
  question:"Since Act 142 of 2024 repealed the mandatory pre-licensing course, what is still true about becoming a licensed Pennsylvania producer?",
  options:["No exam or application is required anymore at all","An applicant must still pass the state licensing exam and submit a license application, even without a mandatory pre-licensing course","A four-year college degree became mandatory instead","Only the CE requirement was affected, not the initial licensing process"],
  correctIndex:1,
  statuteCitation:"Act 142 of 2024; Insurance Department Act of 1921",
  explanation:"Act 142 removed the coursework prerequisite, not the exam or the application process — applicants still must pass the PSI exam and submit a proper license application. Option C invents a degree requirement that doesn't exist, and option D wrongly limits the Act's effect to CE alone when it specifically targeted pre-licensing education." },

{ id:36, category:"Property Fundamentals", difficulty:"easy", tags:["acv-rc"],
  question:"A homeowner's 10-year-old roof, originally costing $12,000, is destroyed by a covered peril. Under an Actual Cash Value settlement, how is the payout generally determined?",
  options:["Replacement cost with no deduction","Replacement cost minus depreciation","The original purchase price only","Market value of the entire home"],
  correctIndex:1,
  statuteCitation:"General ACV valuation principle; ISO HO-3 Loss Settlement provisions",
  explanation:"ACV equals replacement cost minus depreciation, reflecting the item's actual condition and remaining useful life. Option A describes replacement cost coverage, a different valuation basis, and option D wrongly substitutes the whole home's market value for the value of the damaged component alone." },

{ id:37, category:"Property Fundamentals", difficulty:"medium", tags:["acv-rc"],
  question:"A dwelling policy provides Replacement Cost coverage instead of ACV. What does this generally mean for a covered loss?",
  options:["The insurer pays only the depreciated value","The insurer pays to repair or replace the property with new materials of like kind and quality, without deducting depreciation, subject to policy limits","The insured must pay the depreciation difference in cash before repairs begin","Replacement cost coverage never applies to dwellings, only contents"],
  correctIndex:1,
  statuteCitation:"ISO HO-3 Loss Settlement (Replacement Cost provisions)",
  explanation:"Replacement cost coverage removes the depreciation deduction, so property is generally replaced without a depreciation penalty, up to policy limits and often subject to an insurance-to-value requirement. Option A describes ACV — the opposite settlement method being tested here." },

{ id:38, category:"Property Fundamentals", difficulty:"hard", tags:["coinsurance"],
  question:"A commercial building valued at $500,000 requires 80% coinsurance ($400,000 required). The owner insures it for only $300,000. A covered loss of $100,000 occurs. How much will the insurer pay, before any deductible?",
  options:["$100,000","$75,000","$60,000","$50,000"],
  correctIndex:1,
  statuteCitation:"Standard commercial property coinsurance clause (ISO Causes of Loss forms)",
  explanation:"The coinsurance formula is (Insurance Carried ÷ Insurance Required) × Loss. Here that's ($300,000 ÷ $400,000) × $100,000 = $75,000. Choosing the full $100,000 ignores the coinsurance penalty entirely, a common mistake when insurance-to-value isn't checked first." },

{ id:39, category:"Property Fundamentals", difficulty:"medium", tags:["ho3","ho-forms"],
  question:"What distinguishes the ISO HO-3 (Special Form) from named-peril homeowners forms with respect to the dwelling?",
  options:["HO-3 covers the dwelling on an open-perils (all-risk) basis, subject to specific exclusions","HO-3 covers the dwelling on a named-perils basis only","HO-3 provides no dwelling coverage at all","HO-3 covers personal property on an open-perils basis but the dwelling on named perils only"],
  correctIndex:0,
  statuteCitation:"ISO HO-3 Special Form",
  explanation:"HO-3's signature feature is open-perils coverage on the dwelling — covered unless specifically excluded — while personal property is typically covered on a named-perils basis. Option D actually describes the reverse pairing, which is the classic trap on this topic." },

{ id:40, category:"Property Fundamentals", difficulty:"easy", tags:["ho-forms"],
  question:"Which homeowners form is designed for a tenant who does not own the dwelling structure they live in?",
  options:["HO-3","HO-4","HO-6","DP-3"],
  correctIndex:1,
  statuteCitation:"ISO HO-4 (Contents Broad Form / Renters)",
  explanation:"HO-4 covers a renter's personal property and liability without dwelling coverage, since the tenant doesn't own the building. HO-6 is the parallel concept for condo unit owners — a frequently confused pair on the exam." },

{ id:41, category:"Property Fundamentals", difficulty:"medium", tags:["ho-forms"],
  question:"A condo unit owner needs coverage for their unit's interior finishes, personal property, and liability, since the condo association insures the building structure. Which form fits?",
  options:["HO-3","HO-4","HO-6","DP-3"],
  correctIndex:2,
  statuteCitation:"ISO HO-6 (Unit-Owners Form)",
  explanation:"HO-6 is built for condo/co-op unit owners, covering personal property and specified interior improvements layered on top of the association's master policy. Choosing HO-4 here would leave interior improvements potentially uninsured, since HO-4 assumes no ownership interest in the structure at all." },

{ id:42, category:"Property Fundamentals", difficulty:"medium", tags:["ho-forms"],
  question:"A landlord owns a rental dwelling occupied by tenants and does not live there. Which ISO form is typically used for the landlord's building coverage?",
  options:["HO-3","HO-4","HO-6","DP-3"],
  correctIndex:3,
  statuteCitation:"ISO DP-3 (Dwelling Special Form)",
  explanation:"Dwelling policies are designed for non-owner-occupied or seasonal dwellings, with DP-3 providing open-perils coverage similar in structure to an HO-3 but without homeowners-specific liability built in the same way. A standard HO-3 assumes owner-occupancy, making it a structural mismatch here." },

{ id:43, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"What is the key practical difference between a named-perils policy and an open-perils (all-risk) policy?",
  options:["Named-perils covers only perils specifically listed; open-perils covers everything except what's specifically excluded","They are functionally identical in every respect","Open-perils policies cost less because they cover less","Named-perils policies never contain exclusions"],
  correctIndex:0,
  statuteCitation:"General property insurance policy structure concept",
  explanation:"Named-perils coverage exists only if the peril is specifically listed; open-perils coverage exists unless the peril is specifically excluded, generally broader (and often costlier, the opposite of option C)." },

{ id:44, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"In a standard homeowners policy, which coverage part pays additional living expenses when the insured cannot live in the home due to a covered loss?",
  options:["Coverage A","Coverage B","Coverage C","Coverage D"],
  correctIndex:3,
  statuteCitation:"ISO HO-3 Section I — Coverage D (Loss of Use)",
  explanation:"Coverage D (Loss of Use) pays additional living expenses during the repair period. Coverage A is the dwelling itself, B is other structures, and C is personal property — mixing up these four letters is a common structural-knowledge error." },

{ id:45, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"Under a homeowners policy, which section provides personal liability and medical payments to others coverage?",
  options:["Section I","Section II","An endorsement only, never a base section","Homeowners policies never include liability coverage"],
  correctIndex:1,
  statuteCitation:"ISO HO-3 Section II — Liability Coverages",
  explanation:"Section I covers property; Section II covers personal liability (Coverage E) and medical payments to others (Coverage F). Assuming liability is bundled into Section I is a structural mistake that trips up candidates who haven't memorized the two-section layout." },

{ id:46, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A standard homeowners policy suffers a loss from flooding after a nearby river overflows. Is this covered?",
  options:["Yes, flood is always covered under HO-3","No, flood is a standard exclusion; a separate flood policy, often through the NFIP, is required","Only if the homeowner purchases an ISO 'Flood Rider' endorsement","Only earthquakes are excluded; flood is always covered"],
  correctIndex:1,
  statuteCitation:"ISO HO-3 exclusions; National Flood Insurance Act (NFIP)",
  explanation:"Flood is a standard exclusion on homeowners forms; separate flood coverage is required. Option C invents a nonexistent standard ISO endorsement — flood is handled through an entirely separate policy, not a simple rider on the HO form." },

{ id:47, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"What is the National Flood Insurance Program (NFIP)?",
  options:["A Pennsylvania state program","A federal program providing flood insurance, since flood is generally excluded from standard property policies","A private reinsurer of last resort","Part of the Pennsylvania FAIR Plan"],
  correctIndex:1,
  statuteCitation:"National Flood Insurance Act; Flood Disaster Protection Act",
  explanation:"NFIP is a federal program that fills the flood gap left by standard property exclusions. Confusing it with the PA FAIR Plan (option D) is common since both serve as coverage-of-last-resort concepts, but they address entirely different perils at different levels of government." },

{ id:48, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A covered fire loss triggers a local building code requiring the entire structure be brought up to current code during rebuild, at significant added cost. What coverage addresses this gap?",
  options:["Standard Coverage A automatically includes all code upgrade costs","Ordinance or Law coverage, typically added by endorsement","Loss of Use coverage","This cost is never insurable under any circumstance"],
  correctIndex:1,
  statuteCitation:"ISO Ordinance or Law endorsement (e.g., HO 04 77)",
  explanation:"Standard property forms generally exclude the increased cost of complying with current building codes; Ordinance or Law coverage specifically fills that gap. Assuming Coverage A automatically includes it is a frequent, costly misconception." },

{ id:49, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A homeowner's dwelling sits vacant for several months during a slow home sale. How might a standard property policy's vacancy provisions affect coverage?",
  options:["No effect whatsoever, regardless of how long the home sits vacant","Certain coverages, like vandalism, may be suspended once the dwelling has been vacant beyond a specified period","The policy is automatically cancelled the day the home becomes vacant","Vacancy provisions only apply to auto insurance, not property"],
  correctIndex:1,
  statuteCitation:"Standard property policy vacancy provisions (typically triggered at 60 days)",
  explanation:"Most property forms include a vacancy clause suspending certain coverages once the dwelling has sat vacant beyond a set period — it narrows coverage rather than cancelling the policy outright." },

{ id:50, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A client owns a $15,000 engagement ring, but their homeowners policy caps jewelry theft coverage at $1,500. What's the appropriate fix?",
  options:["Nothing can be done; jewelry is never insurable above the sublimit","Add a scheduled personal property endorsement (floater) specifically covering the ring at its appraised value","Switch entirely to an HO-4 policy instead","File a claim in advance to pre-authorize future coverage"],
  correctIndex:1,
  statuteCitation:"Scheduled Personal Property Endorsement (e.g., ISO HO 04 61)",
  explanation:"Scheduling high-value items individually removes them from the low blanket sublimit and can broaden the perils covered. Switching to HO-4 (option C) wouldn't fix a jewelry sublimit issue since that distinction is about tenancy, not item valuation." },

{ id:51, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"After a covered fire, a family lives in a hotel for two months while their home is rebuilt. What does Coverage D typically reimburse?",
  options:["The full cost of the family's rebuilt home","Reasonable additional living expenses beyond the normal cost of living, such as hotel and extra food costs, during restoration","Lost wages from missing work during the displacement","Pain and suffering from the disruption"],
  correctIndex:1,
  statuteCitation:"ISO HO-3 Coverage D (Loss of Use)",
  explanation:"Loss of Use reimburses the incremental extra cost of maintaining a household's normal standard of living elsewhere — it doesn't cover unrelated losses like lost wages or pain and suffering, which fall outside a property policy entirely." },

{ id:52, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"In insurance terminology, what is the difference between a 'peril' and a 'hazard'?",
  options:["They are synonyms and used interchangeably","A peril is the cause of loss, like fire; a hazard is a condition that increases the chance or severity of a loss, like storing gasoline near an open flame","A hazard is only physical; a peril is only financial","A peril is a type of hazard, not a separate concept"],
  correctIndex:1,
  statuteCitation:"Foundational insurance terminology",
  explanation:"Peril is the actual cause of loss, and hazard is something that makes a loss more likely or more severe. Treating them as synonyms causes confusion whenever a question asks which term applies to a described scenario." },

{ id:53, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A business wants to insure its building and its business personal property (inventory, furniture, equipment) under one commercial property form. What form typically provides this?",
  options:["A Businessowners Policy (BOP) exclusively","The Building and Personal Property Coverage Form (BPP)","A standard homeowners HO-3 policy","A Personal Auto Policy"],
  correctIndex:1,
  statuteCitation:"ISO Building and Personal Property Coverage Form (CP 00 10)",
  explanation:"The BPP is the core commercial property form covering both the building and business personal property. A BOP (option A) is a package policy that often bundles similar property coverage with liability for small, eligible businesses, but the BPP is the standalone form being tested here." },

{ id:54, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A restaurant is closed for two months after a covered fire. What coverage compensates for lost net income and continuing expenses during that closure?",
  options:["General liability","Business Income (and Extra Expense) coverage","Umbrella coverage","Workers' compensation"],
  correctIndex:1,
  statuteCitation:"ISO Business Income (and Extra Expense) Coverage Form (CP 00 30)",
  explanation:"Business Income coverage replaces lost net income and continuing normal operating expenses during a covered restoration period. General liability (option A) responds to third-party injury or property damage claims, not the business's own lost income." },

{ id:55, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A general contractor requires a subcontractor to add them as an 'additional insured' on the subcontractor's general liability policy for a specific job. What does this generally accomplish?",
  options:["It makes the contractor a co-owner of the policy with full control","It extends liability coverage to the contractor for claims arising out of the subcontractor's work on that job, without making them the primary policyholder","It cancels the subcontractor's own coverage","It has no legal effect and is purely a formality"],
  correctIndex:1,
  statuteCitation:"ISO Additional Insured Endorsements (e.g., CG 20 10)",
  explanation:"Additional insured status extends coverage to a third party for liability arising from the named insured's work, without transferring policy ownership or control. Treating it as a pure formality ignores the real contractual risk-transfer purpose behind these endorsements." },

{ id:56, category:"Property Fundamentals", difficulty:"hard", tags:[],
  question:"A loss results from a combination of a covered peril (wind) and an excluded peril (flood) occurring together. What does an anti-concurrent causation clause typically do?",
  options:["Guarantees full coverage because one cause was covered","Excludes coverage for the entire loss if an excluded peril contributed, regardless of a covered peril also being present","Automatically splits the claim 50/50","Has no practical effect on claim outcomes"],
  correctIndex:1,
  statuteCitation:"Standard property policy anti-concurrent causation exclusion language",
  explanation:"Anti-concurrent causation clauses are drafted so that if an excluded peril contributes to a loss in any sequence or combination with a covered peril, the exclusion still applies to the whole loss — broader and less generous than a proportional split." },

{ id:57, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"After a covered property loss, what is a policyholder generally required to do under standard policy conditions?",
  options:["Nothing; insurers must investigate on their own initiative with no cooperation required","Give prompt notice, protect property from further damage, and cooperate with the investigation, including proof of loss","Hire their own public adjuster before any claim can be considered valid","Wait 90 days before reporting the loss to avoid seeming hasty"],
  correctIndex:1,
  statuteCitation:"Standard property policy 'Duties After Loss' conditions",
  explanation:"Policies require the insured's cooperation — prompt notice, reasonable steps to prevent further damage, and often a sworn proof of loss. Delaying notice on purpose can actually jeopardize a claim, since prompt notice is exactly what's required." },

{ id:58, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"For a property insurance claim to be valid, when must the insured have an insurable interest in the property?",
  options:["Only at policy inception","At the time of the loss","Only when the claim is filed with the insurer","Insurable interest is not required for property insurance"],
  correctIndex:1,
  statuteCitation:"General insurable interest doctrine for property insurance",
  explanation:"Property insurance requires insurable interest to exist at the time of loss, unlike life insurance, which requires it only at inception. Someone who sold a home before a fire no longer has an insurable interest at that time and couldn't collect." },

{ id:59, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A homeowner has two overlapping property policies on the same dwelling from different insurers, without either insurer's knowledge of the other. How is a covered loss typically settled?",
  options:["Both insurers pay the full loss amount independently, doubling the payout","The 'other insurance' clause typically triggers pro-rata contribution between the insurers based on their respective limits","Only the more expensive policy pays anything","Neither policy pays because dual coverage voids both"],
  correctIndex:1,
  statuteCitation:"Standard property policy 'Other Insurance' condition",
  explanation:"Other insurance clauses prevent double recovery by prorating the loss between insurers according to their share of total coverage in force, upholding the principle of indemnity." },

{ id:60, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A homeowner runs a small daycare business out of their home, and a child is injured during daycare hours. Would the standard homeowners liability coverage (Section II) respond?",
  options:["Yes, homeowners liability covers all injuries occurring at the home","Generally no — business pursuits are a standard homeowners exclusion, requiring separate business liability coverage","Only if the injury happened outside the home","Only if the injured child was a family member"],
  correctIndex:1,
  statuteCitation:"ISO HO-3 Section II exclusions — Business Pursuits",
  explanation:"Standard homeowners liability excludes business activities conducted from the residence; a daycare operation needs its own commercial general liability or a specific in-home business endorsement." },

{ id:108, category:"Property Fundamentals", difficulty:"easy", tags:["acv-rc"],
  question:"A 2-year-old $3,000 television is stolen from a home with ACV-only personal property coverage. How is the settlement calculated?",
  options:["The full $3,000 with no depreciation","$3,000 minus depreciation for age and condition","The original store markup value","Nothing; electronics are never covered"],
  correctIndex:1,
  statuteCitation:"General ACV valuation principle",
  explanation:"ACV always deducts depreciation reflecting the item's age and condition — paying the full $3,000 (option A) would actually describe replacement cost coverage instead, which is a different valuation basis than what's described in this ACV-only scenario." },

{ id:109, category:"Property Fundamentals", difficulty:"medium", tags:["acv-rc"],
  question:"A homeowner has Replacement Cost coverage. After a covered loss, how are they typically paid?",
  options:["Full replacement cost upfront in one check with no conditions","Often ACV first, with the remaining depreciation held back and paid after the insured actually repairs or replaces the property","Never more than $500 total, regardless of the loss","Only if they use the insurer's preferred contractor"],
  correctIndex:1,
  statuteCitation:"ISO RC loss settlement holdback provision",
  explanation:"Many replacement cost settlements are paid in two steps: an initial ACV payment, then the recoverable depreciation once the insured actually completes repair or replacement — this holdback structure prevents paying full replacement cost to someone who never rebuilds." },

{ id:110, category:"Property Fundamentals", difficulty:"easy", tags:["ho-forms"],
  question:"Which homeowners form provides no coverage for the dwelling structure itself, only contents and liability, and is designed specifically for tenants?",
  options:["HO-3","HO-4","HO-6","DP-3"],
  correctIndex:1,
  statuteCitation:"ISO HO-4 (Contents Broad Form / Renters)",
  explanation:"HO-4 intentionally omits dwelling coverage because tenants don't own the building. HO-3 (option A) and DP-3 (option D) both include dwelling coverage for owners, and HO-6 (option C) is for condo unit owners, not renters." },

{ id:111, category:"Property Fundamentals", difficulty:"medium", tags:["ho-forms"],
  question:"A person owns a condo unit covered by an association master policy, while a different person owns a small non-owner-occupied rental house. Which forms respectively fit each situation?",
  options:["HO-6 for the condo owner; DP-3 for the rental house","HO-4 for the condo owner; HO-3 for the rental house","DP-3 for the condo owner; HO-6 for the rental house","HO-3 for both situations"],
  correctIndex:0,
  statuteCitation:"ISO HO-6 and DP-3 forms",
  explanation:"HO-6 fits the condo owner (personal property plus interior improvements layered on the association's master policy), and DP-3 fits the landlord's non-owner-occupied rental. Option C swaps the two forms entirely, and option B substitutes the wrong forms for both scenarios." },

{ id:112, category:"Property Fundamentals", difficulty:"medium", tags:["ho3"],
  question:"Which of these perils is generally covered on personal property under a standard HO-3 policy, since personal property is typically covered on a named-perils basis?",
  options:["Flood","Fire","Earth movement","War"],
  correctIndex:1,
  statuteCitation:"ISO HO-3 named perils for personal property (Coverage C)",
  explanation:"Fire is a standard named peril covered on personal property under HO-3. Flood, earth movement, and war are standard exclusions across virtually all homeowners forms, whether covering the dwelling on an open-perils basis or contents on a named-perils basis." },

{ id:113, category:"Property Fundamentals", difficulty:"hard", tags:["coinsurance"],
  question:"A building valued at $200,000 has a 90% coinsurance requirement. It is insured for $150,000. A $40,000 covered loss occurs. What does the insurer pay, before any deductible?",
  options:["$40,000","$36,000","$33,333","$30,000"],
  correctIndex:2,
  statuteCitation:"Standard commercial property coinsurance clause",
  explanation:"Required insurance is 90% × $200,000 = $180,000. The formula is ($150,000 ÷ $180,000) × $40,000 ≈ $33,333. Paying the full $40,000 (option A) ignores the coinsurance penalty for being underinsured relative to the 90% requirement." },

{ id:114, category:"Property Fundamentals", difficulty:"medium", tags:["coinsurance"],
  question:"A commercial property owner wants to avoid the risk of a coinsurance penalty entirely without constantly updating the insured value. What endorsement addresses this?",
  options:["An Agreed Value endorsement, which suspends the coinsurance penalty for a set period based on a pre-agreed value","An Ordinance or Law endorsement","A Named Non-Owner endorsement","A stacking endorsement"],
  correctIndex:0,
  statuteCitation:"Standard commercial property Agreed Value endorsement",
  explanation:"An Agreed Value endorsement locks in a stated value and suspends the coinsurance penalty as long as that agreed value is carried, removing the constant need to verify insurance-to-value. The other endorsements listed address entirely unrelated coverage gaps." },

{ id:115, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A business owner has multiple buildings across several locations and wants one limit to apply flexibly across all of them rather than a separate limit per building. What type of limit accomplishes this?",
  options:["Specific insurance","Blanket insurance","Named perils insurance","Actual cash value insurance"],
  correctIndex:1,
  statuteCitation:"Commercial property Blanket vs. Specific limit structure",
  explanation:"Blanket insurance applies one limit flexibly across multiple locations or items, unlike specific insurance (option A), which assigns a separate fixed limit to each location individually." },

{ id:116, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A commercial building is under construction and not yet occupied. What type of policy is typically used to insure the structure during the construction period?",
  options:["A standard BPP","Builders Risk (Course of Construction) coverage","Homeowners HO-3","An inland marine cargo policy"],
  correctIndex:1,
  statuteCitation:"Builders Risk (Course of Construction) coverage form",
  explanation:"Builders risk policies are specifically designed for structures under construction, addressing the unique, changing risk profile of a building that isn't finished or occupied yet — a standard BPP (option A) assumes a completed, occupied structure." },

{ id:117, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A photographer wants to insure expensive camera equipment that travels to different job sites regularly. What type of coverage is best suited to this mobile, high-value equipment?",
  options:["A standard BPP with no endorsement","An inland marine floater covering scheduled equipment wherever it travels","Ocean marine cargo insurance","Umbrella liability coverage"],
  correctIndex:1,
  statuteCitation:"Inland Marine floater coverage",
  explanation:"Inland marine floaters are designed precisely for mobile, high-value property that moves between locations, unlike a standard BPP, which is typically tied to a fixed described premises. Ocean marine (option C) addresses waterborne cargo/vessels, an unrelated exposure." },

{ id:118, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"Under a standard HO-3, personal property temporarily located away from the insured residence, such as in a hotel during travel, is generally covered:",
  options:["Not at all, under any circumstances","Yes, generally up to a percentage of the Coverage C limit (commonly around 10%, subject to the specific policy)","Only if each item is scheduled individually first","Only if the travel stays within Pennsylvania"],
  correctIndex:1,
  statuteCitation:"Standard ISO HO-3 off-premises personal property extension (percentage of Coverage C — confirm current policy declarations for the exact percentage)",
  explanation:"HO-3 policies commonly extend a portion of Coverage C to personal property away from the residence, so travel-related losses aren't automatically excluded. Requiring individual scheduling first (option C) misunderstands this as a blanket, not item-specific, extension." },

{ id:119, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"If a homeowner has not purchased extra Ordinance or Law coverage, how much protection, if any, does a standard HO-3 typically provide for code-upgrade costs?",
  options:["None whatsoever, under any circumstance","A modest built-in amount is often included automatically (commonly a percentage of Coverage A), though many owners buy additional limits","Unlimited coverage automatically","Only available as a completely separate stand-alone policy, never an endorsement"],
  correctIndex:1,
  statuteCitation:"Standard ISO HO-3 built-in Ordinance or Law provision (percentage of Coverage A — confirm current policy language)",
  explanation:"Many HO-3 policies include a modest baseline ordinance-or-law allowance by default, with additional limits available by endorsement for owners who want more protection. Assuming zero built-in coverage (option A) overstates the gap, just as assuming unlimited coverage (option C) understates the real limit." },

{ id:120, category:"Property Fundamentals", difficulty:"easy", tags:["acv-rc"],
  question:"A homeowner wants their personal belongings replaced without a depreciation deduction, since the base policy settles contents on an ACV basis. What should they add?",
  options:["A Personal Property Replacement Cost endorsement","An Ordinance or Law endorsement","A Scheduled Jewelry endorsement only","A Loss of Use endorsement"],
  correctIndex:0,
  statuteCitation:"Personal Property Replacement Cost endorsement",
  explanation:"This specific endorsement converts contents settlement from ACV to replacement cost. The other endorsements address entirely different gaps — code-upgrade costs, individual high-value items, and additional living expenses, respectively." },

{ id:121, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"Standard commercial property forms typically exclude earth movement and earthquake. What type of specialized coverage fills this gap for businesses in earthquake-prone areas?",
  options:["A Difference in Conditions (DIC) or standalone earthquake policy","A standard workers' compensation policy","Ordinary general liability coverage","Umbrella liability coverage alone"],
  correctIndex:0,
  statuteCitation:"Difference in Conditions (DIC) / standalone earthquake coverage",
  explanation:"DIC or standalone earthquake policies specifically fill the earth movement gap left by standard commercial property exclusions. Workers' comp and general liability (options B and C) address entirely different exposures — employee injury and third-party liability, not property damage from earth movement." },

{ id:122, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"If an insured intentionally conceals or misrepresents a material fact when filing a claim, what is the likely consequence under standard policy conditions?",
  options:["No consequence as long as the claim amount is small","The insurer may deny the entire claim, even the legitimate portion, under the concealment/fraud condition","Only a partial reduction in payment is possible","The policy is unaffected; only criminal charges may apply"],
  correctIndex:1,
  statuteCitation:"Standard property policy Concealment or Fraud condition",
  explanation:"Standard policies allow denial of the entire claim, not just the misrepresented portion, when material concealment or fraud is involved — this is a stronger consequence than a mere partial reduction (option C), and it operates independent of any separate criminal proceedings (option D)." },

{ id:123, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A homeowner's mortgage lender is listed on the property policy under a standard mortgagee clause. What protection does this generally give the lender?",
  options:["None; mortgagees have no special status under a property policy","The lender's interest in a covered loss payment can be protected even if the homeowner's own claim is denied due to their own misconduct, subject to conditions","The lender becomes a co-insured with full policy control","The mortgagee clause only matters for auto loans, not homes"],
  correctIndex:1,
  statuteCitation:"Standard property policy Mortgagee Clause (Standard Mortgage Clause)",
  explanation:"The standard mortgagee clause creates an independent contract right for the lender, protecting their financial interest even when the named insured's own claim is barred by their own acts (like arson), as long as the lender itself didn't know about or participate in the misconduct." },

{ id:124, category:"Property Fundamentals", difficulty:"medium", tags:["acv-rc"],
  question:"Which best describes how courts and most policies typically calculate Actual Cash Value?",
  options:["Fair market value of the entire property","Replacement cost minus depreciation (the most common method), though some jurisdictions also recognize a broad evidence/market value approach","The original purchase price with no adjustment","Always equal to the policy limit, regardless of the actual loss"],
  correctIndex:1,
  statuteCitation:"General ACV valuation doctrine",
  explanation:"Replacement cost minus depreciation is the dominant ACV method, though some jurisdictions apply a broader 'fair market value' or 'broad evidence' approach in certain contexts. ACV is never simply equal to the policy limit (option D) — the limit is just the maximum payable, not the guaranteed payout." },

{ id:125, category:"Property Fundamentals", difficulty:"medium", tags:["acv-rc"],
  question:"A dwelling policy includes 'Extended Replacement Cost' coverage. What does this typically add beyond a standard replacement cost limit?",
  options:["Nothing additional beyond the stated Coverage A limit","An extra percentage above the Coverage A limit if rebuilding costs exceed the stated limit due to factors like post-disaster material and labor spikes","Coverage for flood losses specifically","A guarantee that premiums will never increase"],
  correctIndex:1,
  statuteCitation:"Extended Replacement Cost endorsement",
  explanation:"Extended replacement cost provides a cushion (often a set percentage) above the stated dwelling limit for situations where actual rebuilding costs spike beyond what was originally estimated, such as after a widespread regional disaster drives up labor and material costs." },

{ id:126, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"Which of these is a standard, near-universal exclusion under homeowners property coverage?",
  options:["Fire caused by lightning","Gradual wear and tear, deterioration, or inherent defects","Theft by a stranger","Wind damage from a named storm"],
  correctIndex:1,
  statuteCitation:"Standard homeowners policy exclusions",
  explanation:"Gradual, expected deterioration is excluded because insurance covers sudden, accidental losses, not the normal aging process of property. Lightning-caused fire, theft, and wind are all standard covered perils under most homeowners forms, not exclusions." },

{ id:127, category:"Property Fundamentals", difficulty:"medium", tags:[],
  question:"A retailer's inventory levels fluctuate significantly throughout the year. What kind of coverage form addresses this reporting challenge?",
  options:["A Reporting Form (value reporting form) allowing periodic reporting of actual inventory values","A single fixed-limit policy set once a year with no adjustments","Workers' compensation coverage","An umbrella liability policy"],
  correctIndex:0,
  statuteCitation:"Commercial property Value Reporting Form",
  explanation:"Reporting forms let a business periodically report actual on-hand values so coverage (and premium) can track real fluctuating inventory levels, rather than being locked into one fixed limit that might badly under- or over-insure the business at different points in the year." },

{ id:128, category:"Property Fundamentals", difficulty:"easy", tags:[],
  question:"Does a standard homeowners policy typically extend meaningful coverage to a separate vacant lot the insured owns nearby with no structures on it?",
  options:["Yes, automatically and fully, identical to the primary residence","Generally no meaningful coverage need exists since there's no structure or contents to insure under Section I, though some liability may extend depending on policy language","Only if the lot is directly adjacent to the insured residence","Only for flood-related losses on that lot"],
  correctIndex:1,
  statuteCitation:"Standard homeowners policy 'insured location' definitions",
  explanation:"Since Section I property coverage protects structures and contents, a vacant lot with neither generally has little to insure there, though liability exposure tied to the insured's ownership may still extend under Section II depending on the specific policy language." },

{ id:61, category:"Casualty Fundamentals", difficulty:"hard", tags:["occurrence-claims-made"],
  question:"What is the key difference between an 'occurrence' form and a 'claims-made' form in general liability insurance?",
  options:["Occurrence forms respond based on when the injury or damage happened, regardless of when the claim is filed; claims-made forms respond based on when the claim is made, generally requiring the policy (or tail coverage) to be active at that time","They are identical in every respect","Claims-made forms never expire","Occurrence forms only cover property damage, never bodily injury"],
  correctIndex:0,
  statuteCitation:"ISO CGL Coverage Form (CG 00 01 — Occurrence); Claims-Made CGL Form (CG 00 02)",
  explanation:"This distinction matters enormously for slow-developing claims: an occurrence policy in force at the time of the injury responds even years later, while a claims-made policy needs the claim reported while the policy or an extended reporting period is active. Assuming the two are interchangeable can leave a business with an unexpected coverage gap." },

{ id:62, category:"Casualty Fundamentals", difficulty:"easy", tags:["cgl"],
  question:"The standard CGL policy provides which of the following coverage parts?",
  options:["Bodily Injury/Property Damage Liability, Personal & Advertising Injury Liability, and Medical Payments","Only bodily injury liability","Only property damage to the insured's own property","Homeowners package coverage"],
  correctIndex:0,
  statuteCitation:"ISO CGL Coverage Form (CG 00 01)",
  explanation:"A standard CGL bundles Coverage A, B, and C as described. Options B and C each describe only a fragment of the actual three-part coverage structure." },

{ id:63, category:"Casualty Fundamentals", difficulty:"easy", tags:[],
  question:"To establish negligence in a liability claim, a claimant generally must prove which four elements?",
  options:["Intent, motive, opportunity, and means","Duty, breach of duty, causation, and damages","Contract, consideration, offer, and acceptance","Ownership, possession, control, and use"],
  correctIndex:1,
  statuteCitation:"Common law negligence doctrine",
  explanation:"Negligence requires duty, breach, causation, and damages. Option A describes elements of intentional or criminal conduct, not negligence, while option C is contract law terminology entirely unrelated to a tort claim." },

{ id:64, category:"Casualty Fundamentals", difficulty:"hard", tags:[],
  question:"Pennsylvania applies a modified comparative negligence rule. What does this mean for a plaintiff who is found 55% at fault for their own injury?",
  options:["They can still recover damages reduced by their fault percentage, as long as they're not more at fault than the defendant","They recover full damages regardless of fault","They recover nothing because their fault exceeds the 51% bar","Fault percentages are irrelevant in Pennsylvania"],
  correctIndex:2,
  statuteCitation:"42 Pa.C.S. § 7102 (Comparative negligence — the 51% bar rule)",
  explanation:"Pennsylvania uses a 51% modified comparative negligence bar: a plaintiff who is 51% or more at fault recovers nothing. At 55% fault, this plaintiff is barred entirely — option A wrongly assumes any fault below 100% still allows some recovery, ignoring the statutory cutoff." },

{ id:65, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"An employee causes an accident while making deliveries during work hours. Under respondeat superior, who else may be held liable?",
  options:["No one but the employee personally","The employer, for the employee's negligent acts committed within the scope of employment","The employee's spouse, automatically","The vehicle manufacturer, automatically"],
  correctIndex:1,
  statuteCitation:"Common law doctrine of respondeat superior (vicarious liability)",
  explanation:"Respondeat superior holds employers liable for employees' negligent acts committed within the scope of employment duties. Purely personal acts far outside job duties generally fall outside this doctrine, but routine work-related driving squarely fits it." },

{ id:66, category:"Casualty Fundamentals", difficulty:"easy", tags:[],
  question:"The Personal Auto Policy (PAP) is divided into which parts?",
  options:["Part A Liability, Part B Medical Payments, Part C Uninsured Motorists, Part D Damage to Your Auto","Part A Property, Part B Liability only","A single undivided coverage part","Part A Comprehensive, Part B Collision only"],
  correctIndex:0,
  statuteCitation:"ISO Personal Auto Policy (PP 00 01)",
  explanation:"The standard PAP structure separates liability, medical payments, uninsured/underinsured motorists, and physical damage. Collision and comprehensive both live inside Part D, not as separate top-level parts as option D implies." },

{ id:67, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"A parked car is damaged when a shopping cart rolls into it in a parking lot. Which PAP coverage responds?",
  options:["Collision, since it involves impact with another object","Comprehensive, since there was no 'collision' with a moving vehicle in the driving sense","Liability coverage","Uninsured motorist property damage"],
  correctIndex:0,
  statuteCitation:"ISO Personal Auto Policy Part D — Collision definition",
  explanation:"Collision covers impact with another object, including stationary or unrelated objects like a shopping cart, regardless of fault. This scenario is a common trap because people assume 'collision' means a car-to-car crash specifically, when it really means impact generally." },

{ id:68, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"A household member with a poor driving record is excluded from a personal auto policy via a named driver exclusion endorsement. What happens if that excluded person causes an accident while driving the insured vehicle?",
  options:["The policy still fully covers the accident","There is no coverage under that policy for that excluded driver's operation of the vehicle","Only medical payments coverage applies","The named driver exclusion has no legal effect anywhere"],
  correctIndex:1,
  statuteCitation:"PAP Named Driver Exclusion Endorsement",
  explanation:"This endorsement specifically removes coverage for a named individual's operation of the vehicle. Assuming full coverage still applies defeats the entire purpose of the endorsement." },

{ id:69, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"A business regularly rents vehicles for employee use and also has employees occasionally use personal cars for company errands. What coverage addresses these exposures?",
  options:["Standard CGL alone, with no endorsement needed","Hired and Non-Owned Auto coverage, typically added to a commercial auto or liability policy","Workers' compensation","Homeowners liability"],
  correctIndex:1,
  statuteCitation:"ISO Hired and Non-Owned Auto Liability Coverage",
  explanation:"Hired auto coverage addresses rented vehicles, and non-owned auto coverage addresses vehicles the business doesn't own but employees use for business purposes. A standard CGL typically excludes auto-related liability entirely." },

{ id:70, category:"Casualty Fundamentals", difficulty:"medium", tags:["umbrella"],
  question:"A commercial umbrella policy sits above several underlying liability policies. What is its primary function?",
  options:["It replaces the need for any underlying policy","It provides additional liability limits above underlying policies and can 'drop down' to fill certain gaps not covered by the underlying policies, subject to a self-insured retention","It only covers property damage to the insured's own building","It never requires any underlying coverage at all"],
  correctIndex:1,
  statuteCitation:"Commercial Umbrella Liability Policy general structure",
  explanation:"Umbrella policies extend liability limits and can broaden coverage for certain gaps, dropping down with a self-insured retention when underlying coverage doesn't apply. Umbrellas sit on top of, not replace, adequate underlying primary coverage." },

{ id:71, category:"Casualty Fundamentals", difficulty:"easy", tags:["workers-comp"],
  question:"Which of the following is NOT one of the standard categories of workers' compensation benefits?",
  options:["Medical benefits","Wage-replacement (disability) benefits","Pain and suffering (general damages)","Death and burial benefits"],
  correctIndex:2,
  statuteCitation:"Standard workers' compensation benefit structure",
  explanation:"Workers' comp benefits are limited to medical, wage-replacement, specific/scheduled losses, and death/burial benefits — pain-and-suffering-style general damages are a tort concept unavailable precisely because of the exclusive remedy trade-off." },

{ id:72, category:"Casualty Fundamentals", difficulty:"medium", tags:["workers-comp"],
  question:"In monopolistic-fund states (not Pennsylvania, which allows private carriers), a business might need 'stop-gap' coverage. What gap does stop-gap coverage fill?",
  options:["It fills the employers liability gap left when workers' comp must be purchased from a state monopoly fund without a Part Two-style employers liability coverage bundled in","It covers general auto liability","It provides umbrella coverage for personal auto risks","It is unrelated to workers' compensation entirely"],
  correctIndex:0,
  statuteCitation:"Employers Liability / Stop-Gap coverage concept",
  explanation:"In monopolistic fund states, the state fund often doesn't include employers liability coverage, so businesses buy separate stop-gap coverage to fill that specific hole. Pennsylvania isn't a monopolistic state, but the concept still appears in national-content exam sections." },

{ id:73, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"Which type of business is most likely to qualify for a standard Businessowners Policy (BOP)?",
  options:["A large multinational manufacturing conglomerate","A small retail shop or office under a certain size and revenue threshold, with low-to-moderate risk operations","A nuclear power plant","A professional liability-only medical malpractice practice"],
  correctIndex:1,
  statuteCitation:"ISO Businessowners Policy (BOP) eligibility guidelines",
  explanation:"BOPs are built for small-to-midsize, lower-hazard businesses as a bundled property-plus-liability package. Larger, high-hazard, or highly specialized risks fall outside standard BOP eligibility." },

{ id:74, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"An accountant makes an error in preparing a client's tax return, causing the client financial loss. Which coverage would most likely respond?",
  options:["General liability","Professional liability (errors and omissions)","Workers' compensation","Commercial auto"],
  correctIndex:1,
  statuteCitation:"Professional Liability (Errors & Omissions) Coverage concept",
  explanation:"GL responds to bodily injury or property damage to third parties, not purely financial loss from a professional service error — that's precisely what E&O coverage is designed for." },

{ id:75, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"A contractor finishes a home renovation. Months later, faulty electrical work they installed causes a fire. Which CGL coverage would typically respond to a resulting liability claim?",
  options:["Products-Completed Operations coverage","Medical payments only","Coverage for the contractor's own tools","Nothing; work completed long ago is never covered"],
  correctIndex:0,
  statuteCitation:"ISO CGL Coverage Form — Products-Completed Operations Hazard",
  explanation:"Completed operations coverage specifically addresses liability arising after the insured's work is finished and turned over to the customer — exactly this fact pattern. It's designed for delayed-manifestation claims like this one." },

{ id:76, category:"Casualty Fundamentals", difficulty:"medium", tags:["cgl-exclusions"],
  question:"A standard CGL policy generally treats pollution-related liability how?",
  options:["Fully covered with no exclusions or limitations","Subject to a broad, often absolute, pollution exclusion, typically requiring a separate environmental/pollution liability policy for meaningful coverage","Only excluded for water pollution, never air pollution","Pollution is never mentioned in CGL forms at all"],
  correctIndex:1,
  statuteCitation:"ISO CGL Pollution Exclusion (e.g., Total Pollution Exclusion Endorsement, CG 21 49)",
  explanation:"Modern CGL forms carry broad, often near-absolute pollution exclusions, pushing meaningful pollution liability coverage into standalone environmental policies." },

{ id:77, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"A contract between a property owner and a contractor includes a clause where the contractor's insurer waives its right of subrogation against the owner. What is the practical effect?",
  options:["The contractor's insurer cannot later pursue the owner to recover a claim payment, even if the owner was partly responsible","It has no legal effect on the parties","It cancels the contractor's own coverage entirely","It automatically adds the owner as a named insured on the policy"],
  correctIndex:0,
  statuteCitation:"Standard 'Waiver of Subrogation' contractual risk transfer provision",
  explanation:"A subrogation waiver contractually blocks the insurer's usual right to recover claim payments from a responsible third party. It doesn't touch the contractor's own coverage or automatically confer named-insured status, which are separate mechanisms." },

{ id:78, category:"Casualty Fundamentals", difficulty:"medium", tags:[],
  question:"Why might a landlord require a commercial tenant to name them as an additional insured on the tenant's general liability policy?",
  options:["So the landlord's own policy becomes unnecessary","So the landlord gets liability protection for claims arising from the tenant's operations on the leased premises, without relying solely on their own policy","So the tenant's rent is reduced as a result","So the landlord can cancel the tenant's lease more easily"],
  correctIndex:1,
  statuteCitation:"ISO Additional Insured Endorsements (e.g., CG 20 11 for managers/lessors of premises)",
  explanation:"This standard commercial leasing risk-transfer practice gives the landlord a direct liability safety net, supplementing rather than replacing their own separate coverage." },

{ id:79, category:"Casualty Fundamentals", difficulty:"medium", tags:[],

function normalizeQuestions(raw) {
  return raw.map(q => ({
    tags: [], difficulty: "medium", verifyCurrent: false,
    ...q,
  }));
}
const QUESTIONS = normalizeQuestions(RAW_QUESTIONS);
const BANK_SIZE = QUESTIONS.length;

/* =========================================================================================
   PERSISTENCE
   ========================================================================================= */
const LS_VAULT = "kp_vault_v3";   // { [questionId]: { streak, lastSeen, addedAt } }
const LS_STATS = "kp_stats_v3";   // { sessions, totalCorrect, totalAnswered, history[], categoryStats:{cat:{correct,total}} }
const LS_THEME = "kp_theme_v1";

function loadVault() { try { return JSON.parse(localStorage.getItem(LS_VAULT)) || {}; } catch(e) { return {}; } }
function saveVault(v) { try { localStorage.setItem(LS_VAULT, JSON.stringify(v)); } catch(e){} }

function markWrong(id) {
  const v = loadVault();
  const now = Date.now();
  v[id] = { streak: 0, lastSeen: now, addedAt: (v[id] && v[id].addedAt) || now };
  saveVault(v);
}
function markRight(id) {
  const v = loadVault();
  if (v[id]) {
    v[id].streak = (v[id].streak || 0) + 1;
    v[id].lastSeen = Date.now();
    if (v[id].streak >= 2) delete v[id];
    saveVault(v);
  }
}
function removeFromVault(id) { const v = loadVault(); delete v[id]; saveVault(v); }
function clearVault() { saveVault({}); }

function vaultEntries(recentOnly) {
  const v = loadVault();
  let entries = Object.keys(v).map(id => ({ id: Number(id), ...v[id] }));
  if (recentOnly) {
    const cutoff = Date.now() - 7 * 86400 * 1000;
    entries = entries.filter(e => e.lastSeen >= cutoff);
  }
  entries.sort((a, b) => b.lastSeen - a.lastSeen);
  return entries;
}

function loadStats() {
  try {
    return JSON.parse(localStorage.getItem(LS_STATS)) || { sessions: 0, totalCorrect: 0, totalAnswered: 0, history: [], categoryStats: {} };
  } catch(e) {
    return { sessions: 0, totalCorrect: 0, totalAnswered: 0, history: [], categoryStats: {} };
  }
}
function saveStats(s) { try { localStorage.setItem(LS_STATS, JSON.stringify(s)); } catch(e){} }

function recordSession(mode, correct, total, categoryBreakdown) {
  const stats = loadStats();
  stats.sessions += 1;
  stats.totalCorrect += correct;
  stats.totalAnswered += total;
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  stats.history.push({ mode, correct, total, pct, ts: Date.now() });
  if (stats.history.length > 25) stats.history = stats.history.slice(-25);
  if (categoryBreakdown) {
    if (!stats.categoryStats) stats.categoryStats = {};
    Object.entries(categoryBreakdown).forEach(([cat, v]) => {
      if (!stats.categoryStats[cat]) stats.categoryStats[cat] = { correct: 0, total: 0 };
      stats.categoryStats[cat].correct += v.correct;
      stats.categoryStats[cat].total += v.total;
    });
  }
  saveStats(stats);
}
function resetAllProgress() {
  localStorage.removeItem(LS_STATS);
  localStorage.removeItem(LS_VAULT);
}

/* =========================================================================================
   THEME
   ========================================================================================= */
function applyTheme(theme) {
  if (theme === "dark") document.documentElement.classList.add("dark");
  else document.documentElement.classList.remove("dark");
}
function toggleTheme() {
  const cur = localStorage.getItem(LS_THEME) || "light";
  const next = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem(LS_THEME, next); } catch(e){}
  applyTheme(next);
}
applyTheme(localStorage.getItem(LS_THEME) || "light");

/* =========================================================================================
   TOAST
   ========================================================================================= */
function toast(msg) {
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = "toast pointer-events-auto bg-navy-950 dark:bg-slate-100 text-white dark:text-navy-950 text-[13px] font-medium px-4 py-2.5 rounded-xl shadow-card";
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => { el.remove(); }, 2200);
}

/* =========================================================================================
   STATE + UTIL
   ========================================================================================= */
let state = {
  view: "dashboard",  // dashboard | quiz | results | vault | review
  mode: null,
  order: [],
  currentIndex: 0,
  answers: [],
  timeLimitSec: null,
  timeRemaining: null,
  timerHandle: null,
  blind: false,
  vaultFilterRecent: false,
};

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtTime(sec) {
  if (sec == null) return "";
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function stopTimer() { if (state.timerHandle) { clearInterval(state.timerHandle); state.timerHandle = null; } }

function categoryAccuracy() {
  const stats = loadStats();
  const cs = stats.categoryStats || {};
  const out = {};
  CATEGORIES.forEach(c => {
    const v = cs[c];
    out[c] = v && v.total > 0 ? v.correct / v.total : null;
  });
  return out;
}

function buildAdaptiveOrder(size) {
  size = size || 20;
  const acc = categoryAccuracy();
  const weights = CATEGORIES.map(c => Math.max(0.15, 1 - (acc[c] == null ? 0.5 : acc[c])));
  const totalW = weights.reduce((a,b) => a+b, 0);
  let alloc = CATEGORIES.map((c,i) => Math.max(2, Math.round(size * weights[i] / totalW)));
  let order = [];
  CATEGORIES.forEach((c, i) => {
    const idxs = shuffle(QUESTIONS.map((q,qi)=>qi).filter(qi => QUESTIONS[qi].category === c));
    order = order.concat(idxs.slice(0, Math.min(alloc[i], idxs.length)));
  });
  return shuffle(order).slice(0, size);
}

function buildSessionConfig(mode, extra) {
  extra = extra || {};
  const allIdx = QUESTIONS.map((q,i) => i);
  let order = [], timeLimitSec = null, blind = false;

  if (mode === "full") {
    order = shuffle(allIdx);
    timeLimitSec = EXAM_FACTS.minutes * 60;
  } else if (mode === "rapid") {
    order = shuffle(allIdx).slice(0, Math.min(20, BANK_SIZE));
    timeLimitSec = Math.round(EXAM_FACTS.minutes / EXAM_FACTS.questions * 20) * 60;
  } else if (mode === "pa") {
    order = shuffle(allIdx.filter(i => QUESTIONS[i].category === "PA Regulations"));
  } else if (mode === "category") {
    order = shuffle(allIdx.filter(i => QUESTIONS[i].category === extra.category));
    timeLimitSec = 30 * 60;
  } else if (mode === "psi") {
    const n = Math.min(EXAM_FACTS.questions, BANK_SIZE);
    order = shuffle(allIdx).slice(0, n);
    timeLimitSec = EXAM_FACTS.minutes * 60;
    blind = true;
  } else if (mode === "adaptive") {
    order = buildAdaptiveOrder(20);
  } else if (mode === "vault") {
    const entries = vaultEntries(extra.recentOnly);
    order = entries.map(e => QUESTIONS.findIndex(q => q.id === e.id)).filter(i => i >= 0);
  } else if (mode === "custom") {
    order = extra.order || [];
  }
  return { mode, order, timeLimitSec, blind };
}

function beginSession(mode, extra) {
  stopTimer();
  const cfg = buildSessionConfig(mode, extra);
  if (cfg.order.length === 0) { toast("Nothing to drill here yet."); render(); return; }

  state = {
    view: "quiz",
    mode: cfg.mode,
    order: cfg.order,
    currentIndex: 0,
    answers: new Array(cfg.order.length).fill(null),
    timeLimitSec: cfg.timeLimitSec,
    timeRemaining: cfg.timeLimitSec,
    timerHandle: null,
    blind: cfg.blind,
    vaultFilterRecent: false,
  };

  if (cfg.timeLimitSec != null) {
    state.timerHandle = setInterval(() => {
      state.timeRemaining--;
      const el = document.getElementById('timer-display');
      if (el) el.textContent = fmtTime(state.timeRemaining);
      if (state.timeRemaining <= 0) { stopTimer(); finishQuiz(); }
    }, 1000);
  }
  render();
}
