      <div class="bg-white dark:bg-navy-900 rounded-2xl shadow-card border border-slate-200 dark:border-navy-800 p-5 pop-in">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="inline-block text-[11px] font-semibold tracking-wide text-navy-600 dark:text-navy-500 bg-navy-600/10 rounded-full px-2.5 py-1">${q.category}</span>
          <span class="inline-block text-[10.5px] font-semibold tracking-wide rounded-full px-2.5 py-1 ${diffColor}">${q.difficulty}</span>
        </div>
        <h2 class="font-display font-700 text-[17px] text-navy-950 dark:text-white mt-3 leading-snug">${q.question}</h2>

        <div id="options" class="mt-4 space-y-2.5"></div>
        <div id="remediation-wrap"></div>

        <p class="text-[11px] text-navy-800/30 dark:text-slate-600 mt-4 text-center">Keys: 1-4 select · Enter/N next · Esc dashboard</p>
      </div>
    </main>

    <div id="sticky-next" class="sticky bottom-3 z-20 max-w-3xl w-full mx-auto px-5 ${answered ? '' : 'hidden'}">
      <button data-action="next-question" class="w-full bg-navy-800 hover:bg-navy-700 text-white font-display font-700 text-[15px] rounded-xl py-4 shadow-card transition-colors">
        ${pos === total - 1 ? "See Results" : "Next Question"}
      </button>
    </div>
  `;

  const optionsWrap = document.getElementById('options');
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = "option-btn w-full text-left border-2 border-slate-200 dark:border-navy-700 rounded-xl px-4 py-4 text-[14.5px] text-navy-950 dark:text-slate-100 bg-white dark:bg-navy-900 hover:border-navy-500/50";
    btn.dataset.action = "select-option";
    btn.dataset.index = i;
    btn.innerHTML = `<span class="font-semibold text-navy-800/50 dark:text-slate-500 mr-1.5">${String.fromCharCode(65+i)}.</span> ${opt}`;
    if (answered) {
      if (!state.blind) applyOptionStyle(btn, i, record.selected, q.correctIndex);
      else if (i === record.selected) btn.classList.add('border-navy-600');
      btn.disabled = true;
    }
    optionsWrap.appendChild(btn);
  });

  if (answered) {
    if (state.blind) {
      document.getElementById('remediation-wrap').innerHTML = `
        <div class="pop-in mt-4 rounded-xl border border-slate-200 dark:border-navy-700 bg-slate-50 dark:bg-navy-950 p-4">
          <p class="text-[13px] text-navy-800/70 dark:text-slate-400">Answer recorded. Feedback and explanations unlock in the full review after you finish the simulation.</p>
        </div>
      `;
    } else {
      showRemediation(q, record);
    }
  }
}

function applyOptionStyle(btn, i, selected, correctIdx) {
  btn.classList.remove('hover:border-navy-500/50');
  if (i === correctIdx) btn.classList.add('border-emerald-600', 'bg-emerald-50', 'dark:bg-emerald-900/20');
  else if (i === selected) btn.classList.add('border-red-500', 'bg-red-50', 'dark:bg-red-900/20');
  else btn.classList.add('opacity-50');
}

function selectAnswer(i) {
  const pos = state.currentIndex;
  if (state.answers[pos] !== null) return;
  const q = QUESTIONS[state.order[pos]];
  const correct = i === q.correctIndex;
  state.answers[pos] = { selected: i, correct };
  if (correct) markRight(q.id); else markWrong(q.id);
  renderQuiz();
}

function optionFailReason(q, i) {
  return `Option ${String.fromCharCode(65+i)} ("${q.options[i]}") is incorrect here.`;
}

function showRemediation(q, record) {
  const wrap = document.getElementById('remediation-wrap');
  const isCorrect = record.correct;
  wrap.innerHTML = `
    <div class="pop-in mt-4 space-y-3">
      <div class="rounded-xl border p-4 ${isCorrect ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800' : 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800'}">
        <p class="font-display font-700 text-[13.5px] ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-700 dark:text-red-400'} flex items-center gap-1.5">
          ${isCorrect
            ? '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Correct'
            : '<svg viewBox="0 0 24 24" class="w-4 h-4" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Root-Cause Analysis'
          }
        </p>
        <p class="text-[13.5px] text-navy-950/80 dark:text-slate-200 mt-1.5 leading-relaxed">${q.explanation}</p>
      </div>
      <div class="rounded-xl border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/20 p-4">
        <p class="font-display font-700 text-[12px] text-amber-800 dark:text-amber-400 flex items-center gap-1.5 uppercase tracking-wide">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none"><path d="M12 3l8 4v5c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 12l1.8 1.8L15 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Statutory / Authority Citation
        </p>
        <p class="text-[13px] text-amber-900/90 dark:text-amber-200/90 mt-1.5 leading-relaxed font-medium">${q.statuteCitation}</p>
        ${q.verifyCurrent ? `<p class="text-[11px] text-amber-800/70 dark:text-amber-400/70 mt-2 italic">⚠ Verify current statute — rules like this change periodically.</p>` : ``}
      </div>
      <div class="flex items-center justify-between px-1">
        ${!isCorrect ? `<p class="text-[12px] text-navy-800/50 dark:text-slate-500">Added to your Wrong Answer Vault.</p>` : `<span></span>`}
        <button data-action="report-error" data-id="${q.id}" class="text-[11.5px] text-navy-800/40 dark:text-slate-500 underline">Report possible error</button>
      </div>
    </div>
  `;
}

function goNext() {
  if (state.currentIndex < state.order.length - 1) {
    state.currentIndex++;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  stopTimer();
  state.view = "results";
  const correctCount = state.answers.filter(a => a && a.correct).length;
  const answeredCount = state.answers.filter(a => a !== null).length;

  const categoryBreakdown = {};
  state.order.forEach((qi, pos) => {
    if (!state.answers[pos]) return;
    const cat = QUESTIONS[qi].category;
    if (!categoryBreakdown[cat]) categoryBreakdown[cat] = { correct: 0, total: 0 };
    categoryBreakdown[cat].total++;
    if (state.answers[pos].correct) categoryBreakdown[cat].correct++;
  });

  recordSession(state.mode, correctCount, answeredCount || state.order.length, categoryBreakdown);
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function renderResults() {
  const total = state.order.length;
  const correctCount = state.answers.filter(a => a && a.correct).length;
  const answeredCount = state.answers.filter(a => a !== null).length;
  const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
  const passed = pct >= EXAM_FACTS.passScore;

  const categories = {};
  const missedTagCounts = {};
  const missedIdx = [];
  state.order.forEach((qi, pos) => {
    const q = QUESTIONS[qi];
    if (!state.answers[pos]) return;
    if (!categories[q.category]) categories[q.category] = { correct: 0, total: 0 };
    categories[q.category].total++;
    if (state.answers[pos].correct) {
      categories[q.category].correct++;
    } else {
      missedIdx.push(qi);
      (q.tags || []).forEach(t => { missedTagCounts[t] = (missedTagCounts[t] || 0) + 1; });
    }
  });

  const categoryRows = Object.entries(categories).map(([name, v]) => {
    const catPct = Math.round((v.correct / v.total) * 100);
    return `
      <div>
        <div class="flex justify-between text-[13px] mb-1">
          <span class="text-navy-950 dark:text-white font-medium">${name}</span>
          <span class="text-navy-800/60 dark:text-slate-400">${v.correct}/${v.total} · ${catPct}%</span>
        </div>
        <div class="h-2 bg-slate-100 dark:bg-navy-800 rounded-full overflow-hidden">
          <div class="h-full rounded-full ${catPct >= 70 ? 'bg-navy-600' : 'bg-amber-500'}" style="width:${catPct}%"></div>
        </div>
      </div>
    `;
  }).join('');

  const weakest = Object.entries(categories).map(([name,v]) => ({ name, pct: Math.round((v.correct/v.total)*100) }))
    .sort((a,b) => a.pct - b.pct).slice(0,2).filter(w => w.pct < 100);

  let insightNote = "";
  const topTag = Object.entries(missedTagCounts).sort((a,b) => b[1]-a[1])[0];
  if (topTag && topTag[1] >= 2 && TAG_LABELS[topTag[0]]) {
    insightNote = `You missed most of the ${TAG_LABELS[topTag[0]]} questions — those are high-frequency on the real exam, so they're worth a focused pass.`;
  } else if (weakest.length) {
    insightNote = `Your weakest area this session was ${weakest[0].name} at ${weakest[0].pct}%.`;
  }

  const missedCount = vaultEntries().length;

  app.innerHTML = `
    <header class="bg-navy-950 dark:bg-navy-900 text-white">
      <div class="max-w-3xl mx-auto px-5 py-6 flex items-center justify-between">
        <div>
          <p class="font-display font-800 text-lg">Keystone Prep</p>
          <p class="text-navy-500 text-xs -mt-0.5">${modeLabel(state.mode)} · Results</p>
        </div>
        ${themeToggleBtn()}
      </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-5 py-6 space-y-5">

      <section class="rounded-2xl shadow-card border p-6 text-center pop-in ${passed ? 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-800' : 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800'}">
        <p class="font-display font-800 text-3xl tracking-tight ${passed ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-600'}">${passed ? 'PASSED' : 'FAILED'}</p>
        <p class="font-display font-800 text-5xl text-navy-950 dark:text-white mt-3">${pct}%</p>
        <p class="text-[13px] text-navy-800/60 dark:text-slate-400 mt-1">${correctCount} of ${answeredCount} correct · 70% required to pass</p>
      </section>

      <section class="bg-white dark:bg-navy-900 rounded-2xl shadow-card border border-slate-200 dark:border-navy-800 p-5 pop-in">
        <h2 class="font-display font-700 text-[15px] text-navy-950 dark:text-white mb-4">Performance by category</h2>
        <div class="space-y-4">${categoryRows}</div>
        ${insightNote ? `<p class="text-[13px] text-navy-800/70 dark:text-slate-300 mt-4 pt-4 border-t border-slate-100 dark:border-navy-800 leading-relaxed">${insightNote}</p>` : ``}
      </section>

      ${state.mode === "psi" ? `
      <button data-action="goto-review" class="w-full bg-navy-800 hover:bg-navy-700 text-white font-display font-700 text-[15px] rounded-xl py-3.5 shadow-card transition-colors">Open Full Review Walkthrough</button>
      ` : ``}

      ${missedIdx.length > 0 ? `
      <button data-action="drill-session-missed" class="w-full bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 text-navy-950 dark:text-white font-display font-700 text-[14px] rounded-xl py-3.5">
        Mini-Drill: ${missedIdx.length} Question${missedIdx.length===1?'':'s'} Missed This Session
      </button>` : ``}

      ${missedCount > 0 ? `
      <section class="bg-navy-900 dark:bg-navy-950 border border-navy-800 text-white rounded-2xl shadow-card p-5 pop-in">
        <p class="font-display font-700 text-[15px]">${missedCount} question${missedCount===1?'':'s'} waiting in your vault</p>
        <p class="text-[13px] text-slate-300/80 mt-1 leading-relaxed">Drill your accumulated misses until each one is mastered and drops out automatically.</p>
        <button data-action="open-vault" class="mt-3 w-full bg-navy-600 hover:bg-navy-500 text-white font-display font-700 text-[14px] rounded-xl py-3 transition-colors">Open Wrong Answer Vault</button>
      </section>` : ``}

      <div class="grid grid-cols-2 gap-2.5">
        <button data-action="retake-mode" class="bg-navy-800 hover:bg-navy-700 text-white font-display font-700 text-[14px] rounded-xl py-3.5 shadow-card transition-colors">Retake Same Mode</button>
        <button data-action="back-dashboard" class="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-800 text-navy-950 dark:text-white font-display font-700 text-[14px] rounded-xl py-3.5 shadow-card transition-colors">Dashboard</button>
      </div>
    </main>
  `;
  state._lastMissedIdx = missedIdx;
}

function renderReview() {
  app.innerHTML = `
    <header class="bg-navy-950 dark:bg-navy-900 text-white sticky top-0 z-10">
      <div class="max-w-3xl mx-auto px-5 py-5 flex items-center justify-between">
        <p class="font-display font-800 text-lg">Full Review Walkthrough</p>
        <button data-action="back-results" class="text-slate-300 text-[13px]">← Results</button>
      </div>
    </header>
    <main class="flex-1 max-w-3xl w-full mx-auto px-5 py-5 space-y-3">
      ${state.order.map((qi, pos) => {
        const q = QUESTIONS[qi];
        const record = state.answers[pos];
        const isCorrect = record && record.correct;
        return `
          <div class="bg-white dark:bg-navy-900 rounded-xl border border-slate-200 dark:border-navy-800 p-4">
            <p class="text-[11px] text-navy-800/40 dark:text-slate-500 mb-1">Q${pos+1} · ${q.category}</p>
            <p class="text-[14px] font-medium text-navy-950 dark:text-white leading-snug">${q.question}</p>
            <div class="mt-2 space-y-1.5">
              ${q.options.map((opt,i) => {
                let cls = "border-slate-200 dark:border-navy-700 text-navy-800/70 dark:text-slate-400";
                if (i === q.correctIndex) cls = "border-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-800 dark:text-emerald-400";
                else if (record && i === record.selected) cls = "border-red-400 bg-red-50 dark:bg-red-900/20 text-red-700 dark:text-red-400";
                return `<div class="border rounded-lg px-3 py-2 text-[13px] ${cls}">${String.fromCharCode(65+i)}. ${opt}</div>`;
              }).join('')}
            </div>
            <p class="text-[12.5px] text-navy-800/70 dark:text-slate-300 mt-2 leading-relaxed">${q.explanation}</p>
            <p class="text-[11.5px] text-amber-700 dark:text-amber-400 mt-1.5 font-medium">${q.statuteCitation}</p>
            ${!record ? `<p class="text-[11.5px] text-navy-800/40 dark:text-slate-500 mt-1 italic">Not answered</p>` : ``}
          </div>
        `;
      }).join('')}
      <button data-action="back-results" class="w-full bg-navy-800 hover:bg-navy-700 text-white font-display font-700 text-[15px] rounded-xl py-3.5 shadow-card transition-colors">Back to Results</button>
    </main>
  `;
}

/* =========================================================================================
   EXPORT / REPORT ERROR
   ========================================================================================= */
function exportVaultMarkdown() {
  const entries = vaultEntries();
  if (!entries.length) { toast("Vault is empty — nothing to export."); return; }
  let md = `# Keystone Prep — Missed Questions Export\n\nGenerated: ${new Date().toLocaleDateString()}\n\n`;
  entries.forEach(e => {
    const q = QUESTIONS.find(x => x.id === e.id);
    if (!q) return;
    md += `## ${q.category} — Q${q.id}\n\n**${q.question}**\n\n`;
    q.options.forEach((opt,i) => { md += `- ${String.fromCharCode(65+i)}. ${opt}${i===q.correctIndex ? "  ✅ correct" : ""}\n`; });
    md += `\n**Explanation:** ${q.explanation}\n\n**Citation:** ${q.statuteCitation}\n\n---\n\n`;
  });
  try {
    const blob = new Blob([md], { type: "text/markdown" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = "keystone-prep-missed-questions.md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast("Exported missed questions.");
  } catch(e) { toast("Export failed — try again."); }
}

function reportError(id) {
  const q = QUESTIONS.find(x => x.id === id);
  if (!q) return;
  const text = `Possible issue — Q${id}: ${q.question}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("Copied — thanks for flagging!")).catch(() => window.prompt("Copy this text to report the issue:", text));
  } else {
    window.prompt("Copy this text to report the issue:", text);
  }
}

/* =========================================================================================
   EVENT DELEGATION
   ========================================================================================= */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === "toggle-theme") { toggleTheme(); return; }
  if (action === "start") {
    const mode = el.dataset.mode;
    const extra = {};
    if (el.dataset.category) extra.category = el.dataset.category;
    if (el.dataset.recent) extra.recentOnly = el.dataset.recent === "true";
    beginSession(mode, extra);
    return;
  }
  if (action === "open-vault") { state.view = "vault"; state.vaultFilterRecent = false; render(); return; }
  if (action === "back-dashboard") { state.view = "dashboard"; render(); return; }
  if (action === "back-results") { state.view = "results"; render(); return; }
  if (action === "goto-review") { state.view = "review"; render(); return; }
  if (action === "vault-filter") { state.vaultFilterRecent = el.dataset.recent === "true"; render(); return; }
  if (action === "delete-vault-item") { removeFromVault(Number(el.dataset.id)); toast("Removed from vault."); render(); return; }
  if (action === "clear-vault") { if (confirm("Clear your entire wrong-answer vault? This can't be undone.")) { clearVault(); toast("Vault cleared."); render(); } return; }
  if (action === "reset-progress") { if (confirm("This clears all saved stats and your wrong-answer vault. This can't be undone. Continue?")) { resetAllProgress(); toast("Progress reset."); render(); } return; }
  if (action === "export-vault") { exportVaultMarkdown(); return; }
  if (action === "report-error") { reportError(Number(el.dataset.id)); return; }
  if (action === "select-option") { selectAnswer(Number(el.dataset.index)); return; }
  if (action === "next-question") { goNext(); return; }
  if (action === "retake-mode") { beginSession(state.mode, {}); return; }
  if (action === "drill-session-missed") {
    const missed = state._lastMissedIdx || [];
    if (!missed.length) { toast("Nothing missed that session!"); return; }
    beginSession("custom", { order: missed });
    return;
  }
});

/* =========================================================================================
   KEYBOARD SUPPORT
   ========================================================================================= */
document.addEventListener('keydown', (e) => {
  if (state.view !== "quiz") return;
  const pos = state.currentIndex;
  const answered = state.answers[pos] !== null;

  if (['1','2','3','4'].includes(e.key) && !answered) {
    selectAnswer(Number(e.key) - 1);
  } else if ((e.key === 'Enter' || e.key === 'n' || e.key === 'N') && answered) {
    goNext();
  } else if (e.key === 'Escape') {
    if (confirm("Exit to dashboard? Progress in this session will be lost.")) {
      stopTimer();
      state.view = "dashboard";
      render();
    }
  }
});

render();
</script>
</body>
</html>
